<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4B1 · The Changing Face of Kung Fu — Words</title>
<style>
/* ============================================================
   KAI · RE2 交互课件设计系统 (bright / kid-first)
   给 12–15 岁孩子：明亮、卡片化、有游戏感。ClassIn 投屏 16:9。
   字体走 Comic Sans MS（Rico 课件铁律 §10），配色出力气。
   布局用 container query 单位 (cqw/cqh)，随舞台缩放不爆框。
   ============================================================ */
:root{
  --orange:#FF7A3D; --orange-d:#EA5B22; --orange-l:#FFE3CE;
  --teal:#12897E;   --teal-d:#0C6A62;   --teal-l:#CDEBE6;
  --pink:#EC4B93;   --pink-d:#D22E78;   --pink-l:#FBD7E8;
  --purple:#8B5CF6; --purple-d:#6D3EE0; --purple-l:#E7DEFB;
  --green:#22B573;  --green-d:#189259;  --green-l:#CDEFDD;
  --amber:#F6A623;  --amber-d:#D8860A;  --amber-l:#FCE7BE;
  --blue:#3D8BFF;   --blue-d:#2168DB;   --blue-l:#D5E6FF;
  --red:#EF4B4B;    --red-d:#CE2E2E;    --red-l:#FBD6D6;
  --ink:#2B2A33; --ink-soft:#5A5866; --line:#EDE7DE;
  --round: "Comic Sans MS","Chalkboard SE","Comic Neue",-apple-system,"PingFang SC",sans-serif;
  --shadow: 0 .9cqh 2.4cqh rgba(60,40,20,.14);
  --shadow-lift: 0 1.6cqh 3.6cqh rgba(60,40,20,.2);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--round);background:#0e1116;overflow:hidden;-webkit-font-smoothing:antialiased}

/* 舞台：16:9 letterbox，container 供 cqw/cqh */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{position:relative;aspect-ratio:16/9;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
  container-type:size;overflow:hidden;border-radius:1.2cqh;background:#fff}

.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
  padding:6.5cqh 6cqw;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.slide.active{opacity:1;visibility:visible}
.slide.center{align-items:center;text-align:center}

/* ---- 背景色板 + 柔和色斑 blob ---- */
.bg-peach{background:#FFF4E7}.bg-mint{background:#EAF7F1}.bg-sky{background:#EEF4FF}
.bg-lemon{background:#FFF8E2}.bg-lilac{background:#F4EFFF}.bg-rose{background:#FFF0F5}
.bg-dark{background:#20303A;color:#EAF3F2}
.blob{position:absolute;border-radius:50%;filter:blur(.2cqh);z-index:0;pointer-events:none}
.slide>*{position:relative;z-index:1}
/* blob 必须压在内容下面：.slide>.blob 特异性(0,2,0) 高于 .slide>*(0,1,0)，
   否则 .slide>* 会把 blob 改成 relative+z1 顶到内容上面（粉色遮挡 bug 2026-07-29） */
.slide>.blob{position:absolute;z-index:0}

/* ---- 文字 ---- */
.eyebrow{display:inline-flex;align-items:center;gap:.5cqw;align-self:flex-start;
  font-size:1.7cqh;font-weight:700;letter-spacing:.03em;color:var(--teal-d);
  background:var(--teal-l);padding:.7cqh 1.4cqw;border-radius:999px}
.center .eyebrow{align-self:center}
h1{font-size:8cqh;line-height:1.02;color:var(--ink);letter-spacing:-.01em;font-weight:700}
h2{font-size:5.4cqh;line-height:1.05;color:var(--ink);margin-top:1cqh;font-weight:700}
h3{font-size:3.4cqh;line-height:1.1;color:var(--ink)}
.lead{font-size:2.7cqh;line-height:1.42;color:var(--ink-soft);max-width:44ch;margin-top:2cqh}
.big{font-size:3.4cqh;line-height:1.35;color:var(--ink)}
.muted{color:var(--ink-soft)}
b,strong{color:inherit;font-weight:700}
.hl-o{color:var(--orange-d)}.hl-p{color:var(--pink-d)}.hl-t{color:var(--teal-d)}
.hl-pu{color:var(--purple-d)}.hl-g{color:var(--green-d)}.hl-b{color:var(--blue-d)}

/* 顶部计时药丸 + 课号 */
.timer{position:absolute;top:5cqh;right:5cqw;z-index:3;display:inline-flex;align-items:center;gap:.6cqw;
  background:#fff;border:.35cqh solid var(--amber-l);color:var(--amber-d);font-weight:700;font-size:1.9cqh;
  padding:.8cqh 1.5cqw;border-radius:999px;box-shadow:var(--shadow)}
#badge{position:absolute;top:5cqh;left:5cqw;z-index:0;pointer-events:none;font-size:1.7cqh;font-weight:700;color:#B9AE9C;letter-spacing:.06em}/*badge-below-2026-08-18*/

/* ---- nav ---- */
#nav{position:fixed;bottom:2cqh;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:1.2cqw}
.navbtn{width:5.4cqh;height:5.4cqh;border-radius:50%;border:none;background:rgba(20,20,30,.32);color:#fff;
  font-size:2.6cqh;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.navbtn:hover{background:rgba(20,20,30,.6)}
#dots{display:flex;gap:.55cqw;flex-wrap:wrap;max-width:64cqw;justify-content:center}
.dot{width:1.05cqh;height:1.05cqh;border-radius:50%;background:rgba(20,20,30,.22);cursor:pointer}
.dot.on{background:var(--orange);transform:scale(1.5)}

/* ---- cards ---- */
.card{background:#fff;border-radius:2.4cqh;box-shadow:var(--shadow);padding:3cqh 2.4cqw}
.grid{display:grid;gap:2cqh 1.8cqw}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.row{display:flex;gap:1.8cqw;align-items:center}
.wrap{display:flex;flex-wrap:wrap;gap:1.4cqh 1.2cqw}

/* accent-bar 列表卡（"我们要读什么"） */
.acard{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:1.8cqh;
  padding:1.8cqh 1.8cqw;box-shadow:var(--shadow);border-left:.9cqw solid var(--c,var(--orange))}
.acard .ic{width:6cqh;height:6cqh;flex:none;border-radius:50%;background:var(--cl,var(--orange-l));
  display:flex;align-items:center;justify-content:center;font-size:3cqh}
.acard .tx{font-size:2.5cqh;font-weight:700;color:var(--ink)}

/* 编号圆牌 */
.numbadge{width:5.4cqh;height:5.4cqh;border-radius:50%;background:var(--c,var(--orange));color:#fff;
  font-size:2.4cqh;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.catlabel{font-size:1.9cqh;font-weight:700;letter-spacing:.05em;color:var(--c,var(--orange));text-transform:uppercase}

/* pill / chip */
.pill{display:inline-flex;align-items:center;gap:.5cqw;background:#fff;border-radius:999px;padding:.7cqh 1.4cqw;
  font-size:1.9cqh;font-weight:700;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:.5cqw;background:var(--cl,#fff);color:var(--c,var(--ink));
  border-radius:999px;padding:1cqh 1.8cqw;font-size:2.3cqh;font-weight:700;cursor:pointer;user-select:none;
  border:.35cqh solid transparent;transition:transform .12s}
.chip:hover{transform:translateY(-.5cqh)}

/* hint 盒 */
.hintbox{margin-top:auto;background:var(--cl,var(--amber-l));border-radius:1.4cqh;padding:1.3cqh 1.4cqw;
  font-size:1.9cqh;font-weight:700;color:var(--c,var(--amber-d));display:flex;gap:.7cqw;align-items:flex-start}

/* discuss / sentence-starter bar */
.discuss{margin-top:2.6cqh;background:#fff;border-radius:1.8cqh;box-shadow:var(--shadow);
  padding:1.8cqh 2cqw;display:flex;align-items:center;gap:1.6cqw}
.discuss .avs{display:flex}
.discuss .av{width:4.6cqh;height:4.6cqh;border-radius:50%;color:#fff;font-weight:700;font-size:2.1cqh;
  display:flex;align-items:center;justify-content:center;margin-left:-1cqw;border:.4cqh solid #fff}
.discuss .av:first-child{margin-left:0}
.discuss .lab .t{font-size:2.4cqh;font-weight:700;color:var(--ink)}
.discuss .lab .s{font-size:1.8cqh;color:var(--ink-soft)}
.starter{margin-left:auto;background:#F1F3F7;border-radius:1.2cqh;padding:1.2cqh 1.6cqw;font-size:2.1cqh;color:var(--ink-soft);font-style:italic}

/* ---- hero ---- */
.hero{padding:0;flex-direction:row;align-items:stretch}
.hero .lt{flex:1.15;display:flex;flex-direction:column;justify-content:center;padding:8cqh 5cqw}
.hero .rt{flex:1;position:relative;overflow:hidden}
.hero .rt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .sub{font-size:4.4cqh;font-weight:700;color:var(--orange-d);margin-top:.4cqh}

/* journey */
.journey{display:flex;gap:1.4cqw;margin-top:3.2cqh}
.jstep{flex:1;background:#fff;border-radius:1.8cqh;padding:2.4cqh 1.2cqw;text-align:center;box-shadow:var(--shadow);position:relative}
.jstep .jn{font-size:1.7cqh;font-weight:700;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase}
.jstep .je{font-size:4.4cqh;margin:.6cqh 0}
.jstep .jt{font-size:2.2cqh;font-weight:700;color:var(--ink);line-height:1.15}
.jstep.now{background:var(--orange);color:#fff}
.jstep.now .jn,.jstep.now .jt{color:#fff}
.jstep.done{background:var(--green-l)}
.jarrow{align-self:center;font-size:3cqh;color:#C9BEAE}

/* video */
.videowrap{margin:2.4cqh auto 0;width:64%;aspect-ratio:16/9;border-radius:2cqh;overflow:hidden;background:#000;box-shadow:var(--shadow-lift)}
.videowrap video{width:100%;height:100%;object-fit:cover;display:block}

/* reading paragraph */
.reading{flex-direction:row;gap:3cqw;align-items:center;justify-content:center}
.reading .txt{width:52%;flex:none}
.reading .para{font-size:2.9cqh;line-height:1.5;color:var(--ink)}
.reading .pic{width:42%;flex:none;position:relative;border-radius:2.2cqh;overflow:hidden;box-shadow:var(--shadow);height:74cqh;align-self:center}
.reading .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
mark{background:var(--amber-l);color:var(--orange-d);padding:0 .18em;border-radius:.3em;font-weight:700}
.parabadge{display:inline-flex;align-items:center;gap:.6cqw;font-size:2.1cqh;font-weight:700;color:#fff;
  background:var(--c,var(--teal));border-radius:999px;padding:.7cqh 1.5cqw;margin-bottom:1.4cqh}

/* reveal button + box (答案点击揭晓) */
.revealbtn{align-self:flex-start;margin-top:2.2cqh;background:var(--orange);color:#fff;border:none;cursor:pointer;
  font-family:var(--round);font-size:2.2cqh;font-weight:700;padding:1.1cqh 2.2cqw;border-radius:1.2cqh;box-shadow:var(--shadow)}
.revealbtn:active{transform:scale(.97)}
.revealbox{margin-top:2cqh;background:var(--green-l);border-left:.8cqw solid var(--green);border-radius:1.2cqh;
  padding:1.8cqh 2cqw;font-size:2.5cqh;font-weight:700;color:var(--green-d);
  max-height:0;opacity:0;overflow:hidden;transition:max-height .4s,opacity .3s,padding .3s;padding-top:0;padding-bottom:0}
.revealbox.show{max-height:40cqh;opacity:1;padding-top:1.8cqh;padding-bottom:1.8cqh}

/* ---- 词汇翻卡 ---- */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1.8cqh 1.6cqw;margin-top:2.4cqh;flex:1;min-height:0;padding-bottom:8cqh}
/* 2026-08-18 Rico 点头后加的 padding-bottom：`#nav` 是 position:fixed（bottom:2cqh + 高约 4.6cqh），
   而 .vgrid 是 flex:1 填满高度，底行的下沿永远压在翻页条那条带上 —— 1920×1080 实测第 4 张卡
   右下角擦进 #nav 4px，`check_clickable.py` 判 FAIL。这条 bug 今天逼出过三次绕路
   （八张翻卡拆成 4+4、翻牌 4 对补到 6 对、本条）。**射程可静态证明 = 只有一副课件**：
   `.vgrid` 只在 `R.vocabFlip` 里出现，而全工程只有 `RE Foundation/Unit06/6C.html` 用 vocabFlip。 */
.flip{perspective:1400px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:1.8cqh;overflow:hidden;box-shadow:var(--shadow)}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.front .lab{position:absolute;left:0;right:0;bottom:0;padding:1.4cqh 1.2cqw;
  background:linear-gradient(0deg,rgba(20,15,10,.86),transparent);color:#fff}
.front .w{font-size:3cqh;font-weight:700}
.front .ipa{font-size:1.7cqh;opacity:.9}
.front .tapme{position:absolute;top:1.2cqh;right:1.2cqw;background:rgba(255,255,255,.9);color:var(--orange-d);
  font-size:1.5cqh;font-weight:700;padding:.5cqh 1cqw;border-radius:999px}
.back{background:#fff;transform:rotateY(180deg);padding:2.2cqh 1.6cqw;display:flex;flex-direction:column;justify-content:center;gap:1cqh}
.back .w{font-size:2.6cqh;font-weight:700;color:var(--orange-d)}
.back .def{font-size:2.1cqh;color:var(--ink);line-height:1.3}
.back .ex{font-size:2cqh;color:var(--ink-soft);font-style:italic;border-top:.3cqh solid var(--line);padding-top:1cqh}
.back .ccq{font-size:1.8cqh;color:var(--teal-d);font-weight:700}

/* quick-set 卡 */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqh 1.8cqw;margin-top:2.4cqh}
.qcard{background:#fff;border-radius:1.6cqh;padding:1.8cqh 1.6cqw;box-shadow:var(--shadow);border-left:.7cqw solid var(--c,var(--purple))}
.qcard .w{font-size:2.6cqh;font-weight:700;color:var(--ink)}
.qcard .w small{font-style:italic;color:var(--ink-soft);font-weight:400;font-size:1.7cqh;margin-left:.6cqw}
.qcard .d{font-size:2cqh;color:var(--ink-soft);margin-top:.5cqh;line-height:1.3}

/* ---- 游戏：多选/配对 ---- */
.game-def{font-size:4cqh;font-weight:700;color:var(--ink);text-align:center;margin:1cqh auto 0;max-width:26ch;min-height:9cqh;
  display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqh 1.8cqw;max-width:64cqw;margin:2.4cqh auto 0}
.opt{background:#fff;border:.5cqh solid transparent;border-radius:1.6cqh;padding:2.2cqh 1.4cqw;font-size:2.6cqh;font-weight:700;
  color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;text-align:center;font-family:var(--round)}
.opt:hover{transform:translateY(-.6cqh)}
.opt.right{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.opt.wrong{background:var(--red-l);border-color:var(--red);color:var(--red-d);animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
.scorepill{position:absolute;top:5cqh;right:5cqw;z-index:3;background:var(--green);color:#fff;
  font-size:2.1cqh;font-weight:700;padding:.7cqh 1.6cqw;border-radius:999px;box-shadow:var(--shadow)}
.gamemsg{text-align:center;font-size:2.4cqh;font-weight:700;color:var(--green-d);margin-top:2cqh;min-height:3cqh}
/* 空的提示条不许占位、更不许压在卡片上：翻牌页底排四张牌下缘约 10% 被它盖住，三视口都点不动
   （2026-08-14 第五轮 DECK-62）。它有内容时照旧显示，`min-height` 只在有字时才需要。 */
.gamemsg:empty{min-height:0;margin-top:0;pointer-events:none}
/* 翻牌页底排的牌下缘会伸到固定翻页条 #nav 底下（实测越界约 6px，三视口都点不动）——
   给牌阵留出翻页条的高度（2026-08-14 第五轮 DECK-62）。
   注意：`overlap_check.py` 抓不到这一类，它只比**有文字的**元素，而翻牌背面是空的。 */
.memgrid{padding-bottom:7cqh;align-content:start;grid-auto-rows:minmax(0,1fr)}
/* 牌用 `aspect-ratio` 定高，行高不够时会**溢出到行外**（这才是压到翻页条上的真原因，
   只加 padding 挡不住）。在翻牌页里让牌**填满所在行**、不再按比例撑高。 */
.memgrid .mcard{aspect-ratio:auto;height:100%;min-height:0}

/* ---- 猜糖游戏 / 揭晓卡 ---- */
.guessrow{display:flex;gap:2cqw;margin-top:3cqh;justify-content:center}
.gcard{flex:1;max-width:26cqw;background:#fff;border-radius:2cqh;padding:2.6cqh 1.4cqw 2cqh;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.gcard:hover{transform:translateY(-.8cqh)}
.gcard .ge{font-size:6.5cqh;line-height:1}
.gcard .gn{font-size:2.3cqh;font-weight:700;color:var(--ink);margin-top:1cqh}
.gcard .bar{height:1.6cqh;background:#EEE;border-radius:999px;margin-top:1.6cqh;overflow:hidden}
.gcard .bar>i{display:block;height:100%;width:0;background:var(--orange);transition:width .9s ease;border-radius:999px}
.gcard .gram{font-size:2.2cqh;font-weight:700;color:var(--orange-d);margin-top:.8cqh;opacity:0;transition:opacity .4s}
.gcard.show .gram{opacity:1}
.gcard.win{outline:.6cqh solid var(--green);outline-offset:-.6cqh}

/* poll (good/bad predict) */
.pollrow{display:flex;gap:2.4cqw;margin-top:3cqh;justify-content:center}
.pollcard{flex:1;max-width:32cqw;background:#fff;border-radius:2cqh;padding:3cqh 1.6cqw;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;border:.6cqh solid transparent;transition:transform .14s}
.pollcard:hover{transform:translateY(-.8cqh)}
.pollcard .pe{font-size:6cqh}
.pollcard .pt{font-size:3cqh;font-weight:700;margin-top:1cqh}
.pollcard .cnt{font-size:2cqh;color:var(--ink-soft);margin-top:.8cqh}
.pollcard.picked{border-color:var(--orange)}

/* gap-fill */
.gaptext{font-size:3cqh;line-height:1.7;color:var(--ink);max-width:52ch}
.blank{display:inline-flex;min-width:9cqw;justify-content:center;border-bottom:.5cqh dashed var(--orange);
  color:var(--orange-d);font-weight:700;padding:0 .4cqw}
.blank.filled{border-bottom-style:solid;background:var(--green-l);border-radius:.4em .4em 0 0}

/* exit recap */
.recap{display:flex;gap:2.4cqw;margin-top:3.4cqh}
.rc{flex:1;background:#fff;border-radius:2cqh;padding:3cqh 1.6cqw;text-align:center;box-shadow:var(--shadow)}
.rc .n{font-size:6cqh;font-weight:700;color:var(--orange-d)}
.rc .t{font-size:2.1cqh;color:var(--ink-soft);margin-top:.6cqh}

/* checklist / list */
.klist{margin-top:2.4cqh;display:flex;flex-direction:column;gap:1.4cqh}
.krow{display:flex;align-items:center;gap:1.2cqw;font-size:2.5cqh;color:var(--ink)}
.krow .kb{width:4.4cqh;height:4.4cqh;flex:none;border-radius:1cqh;background:var(--cl,var(--teal-l));
  color:var(--c,var(--teal-d));display:flex;align-items:center;justify-content:center;font-size:2.3cqh;font-weight:700}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{opacity:0;transform:translateY(2cqh)}
.pop.in{animation:pop .5s forwards}
.pop.d2{animation-delay:.12s}.pop.d3{animation-delay:.24s}.pop.d4{animation-delay:.36s}
@keyframes pop{to{opacity:1;transform:none}}

/* ===== 段后题三件套（2026-07-31）：quiz / pick2 / speak ===== */
/* 注意：class 名不得叫 frame（与舞台全局撞名）——命名前 grep 查重 */
.qzopts{display:flex;flex-direction:column;gap:1.4cqh;margin-top:2.2cqh;max-width:74cqw}
.qzopt{display:flex;align-items:center;gap:1.2cqw;background:#fff;border:.35cqh solid transparent;border-radius:1.6cqh;
  padding:1.7cqh 1.8cqw;font:inherit;font-size:2.5cqh;color:var(--ink);text-align:left;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .16s,border-color .16s;min-height:44px}
.qzopt:hover{transform:translateY(-.4cqh)}
.qzk{flex:none;width:4.6cqh;height:4.6cqh;border-radius:1cqh;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:2.3cqh;text-transform:uppercase}
.qzopt.right{border-color:var(--green);background:var(--green-l)}
.qzopt.right::after{content:'✓';margin-left:auto;color:var(--green-d);font-weight:700;font-size:2.8cqh}
.qzopt.wrong{border-color:var(--red);background:var(--red-l);animation:shake .4s}
.qzopt.wrong::after{content:'✕';margin-left:auto;color:var(--red-d);font-weight:700;font-size:2.4cqh}
.qzopts.done .qzopt{pointer-events:none}
.qznote{margin-top:2cqh;max-width:74cqw;background:var(--amber-l);color:var(--amber-d);border-radius:1.4cqh;
  padding:1.4cqh 1.8cqw;font-size:2.1cqh;opacity:0;max-height:0;overflow:hidden;transition:opacity .3s}
.qznote.show{opacity:1;max-height:20cqh}

.pickrow{display:flex;flex-wrap:wrap;gap:1.6cqw;margin-top:2.6cqh}
.pkchip{background:#fff;border:.35cqh solid transparent;border-radius:1.4cqh;padding:1.5cqh 2.4cqw;
  font:inherit;font-size:2.6cqh;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);min-height:44px;min-width:44px}
.pkchip.right{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.pkchip.right::after{content:' ✓'}
.pkchip.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d);animation:shake .4s}

.spkcard{display:flex;align-items:center;gap:1.8cqw;background:#fff;border-radius:2cqh;padding:2.6cqh 2.4cqw;
  margin-top:2.4cqh;max-width:76cqw;box-shadow:var(--shadow)}
.spkmic{font-size:5cqh;flex:none}
.spkframe{font-size:2.9cqh;color:var(--ink);line-height:1.45}
.spkrule{margin-top:1.8cqh;font-size:2.1cqh;color:var(--ink-soft)}
.chip.spword{cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.chip.spword.picked{outline:.35cqh solid var(--orange);outline-offset:.3cqh}

/* comp 选项（2026-07-31：原来 q.opts 被静默丢弃，选择题变无选项题） */
.copts{display:flex;flex-direction:column;gap:.8cqh;margin-top:.4cqh}
.copt{background:var(--paper,#fff);border:.3cqh solid #e7e0d4;border-radius:1.1cqh;padding:1cqh 1cqw;
  font:inherit;font-size:2.1cqh;color:var(--ink);text-align:left;cursor:pointer;min-height:44px}
.copt.right{border-color:var(--green);background:var(--green-l);color:var(--green-d);font-weight:700}
.copt.right::after{content:' ✓'}
.copt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d);animation:shake .4s}
.copts.done .copt{pointer-events:none}
/* 整幅图（地图/信息图）不许裁切 */
.reading .pic.contain{background:#fff;border-radius:2cqh;display:flex;align-items:center;justify-content:center;padding:1cqh}
.reading .pic.contain img{object-fit:contain;width:100%;height:100%}

/* 整幅图页：地图/信息图必须整幅可读，禁裁切 */
.slide.figpage{align-items:center;text-align:center}
.figwrap{width:90cqw;height:68cqh;margin:1.2cqh auto 0;background:#fff;border-radius:2cqh;
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:1cqh}
.figwrap img{max-width:100%;max-height:100%;object-fit:contain}
.figcap{margin-top:1.1cqh;max-width:88cqw;font-size:2cqh;color:var(--ink);line-height:1.35}
/* comp 四题以上：两列 + 压缩字号，防溢出到屏幕外 */
.grid.dense .card{padding:1.5cqh 1.2cqw;gap:.8cqh}
.grid.dense .big{font-size:2.2cqh!important}
.grid.dense .copt{font-size:1.9cqh;padding:.75cqh .9cqw}
.grid.dense .hintbox{font-size:1.7cqh;padding:.6cqh 1cqw}

<script>
/* ============================================================
   KAI engine · 数据驱动幻灯片渲染 + 全程互动
   LESSON.slides[] -> DOM。给 12 单元生成器复用（只换数据）。
   ============================================================ */
(function(){
  const deck = document.getElementById('deck');
  const dotsEl = document.getElementById('dots');
  const badgeEl = document.getElementById('badge');
  const L = window.LESSON;
  const IMG = (window.KAI_IMG_BASE || 'img/');
  const VID = (window.KAI_VID_BASE || 'video/');
  function imgsrc(fn){ return (window.KAI_IMG_MAP && window.KAI_IMG_MAP[fn]) ? window.KAI_IMG_MAP[fn] : IMG+fn; }
  let cur = 0;
  const N = L.slides.length;

  // 富文本：**粗** / *斜* / ~t~ ~o~ 高亮
  function rt(s){ if(s==null) return '';
    return String(s)
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
      // `__粗体__` 的内容不许含下划线，且前后不许再挨着下划线 —— 否则 `I think ______ because ______.`
      // 里的填空线会被当成粗体标记吃掉（2026-08-14 独立审查 DECK-15：三副课件 18 处填空线残缺，
      // 其中包括 F 级唯一验收物「写一句」的三档句框）。全工程实测没有任何一副课件用 `__粗体__`。
      // 不许用后行断言 `(?<!_)`：那是 ES2018，旧 WebKit（含部分 ClassIn 内置浏览器）解析到就整副白屏
      // （2026-08-14 终审 DECK-34）。改成把前一个字符捕获出来再放回去，ES5 就能跑。
      .replace(/(^|[^_])__([^_]+?)__(?!_)/g,'$1<b>$2</b>')
      .replace(/\*(.+?)\*/g,'<i>$1</i>'); }
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

  // 背景色斑
  const BLOBS = {
    peach:[['#FFE0C2',34,-8,-6],['#CFEDE0',26,84,70],['#FBD6DE',30,88,-10]],
    mint:[['#CFEDE0',34,-6,72],['#FFE0C2',24,80,-8],['#D5E6FF',26,90,60]],
    sky:[['#D5E6FF',34,-8,-8],['#FCE7BE',26,86,74],['#FBD7E8',24,80,-6]],
    lemon:[['#FCE7BE',34,-8,-6],['#CFEDE0',26,84,72],['#E7DEFB',24,88,-8]],
    lilac:[['#E7DEFB',34,-8,72],['#FBD7E8',26,82,-8],['#D5E6FF',24,86,66]],
    rose:[['#FBD7E8',34,-6,-8],['#FCE7BE',26,84,70],['#CFEDE0',24,88,-8]]
  };
  function addBlobs(slide, bg){
    const set = BLOBS[bg]||BLOBS.peach;
    set.forEach(([c,sz,x,y])=>{ const b=el('div','blob'); b.style.cssText=
      `width:${sz}cqw;height:${sz}cqw;background:${c};opacity:.72;left:${x}cqw;top:${y}cqh`; slide.appendChild(b); });
  }

  function timerPill(t){ return t? `<div class="timer">⏱ ${t}</div>`:''; }
  function eyebrow(s){ return s? `<div class="eyebrow">${rt(s)}</div>`:''; }
  function discuss(d){ if(!d) return '';
    return `<div class="discuss"><div class="avs">
       <div class="av" style="background:var(--blue)">A</div>
       <div class="av" style="background:var(--pink)">B</div></div>
       <div class="lab"><div class="t">${rt(d.t||'Discuss with a partner!')}</div>
       <div class="s">${rt(d.s||'Share your idea in the chat before we check.')}</div></div>
       ${d.starter?`<div class="starter">"${rt(d.starter)}"</div>`:''}</div>`; }

  // ---------- 各类型渲染 ----------
  const R = {};

  /* ── 2026-08-18 老师反馈修：词库摆放顺序 == 答案顺序，学生从左到右点就全对。
     ORD_shuffle 做两件事：① 打散；② 保证任一格位上的词 != 该格位的答案。
     种子来自内容哈希，所以同一页每次渲染顺序固定（截图可复现、带课卡对得上），
     不同页之间顺序不同。全 ES5 写法，旧 WebKit（ClassIn 内置浏览器）能跑。 */
  function ORD_seed(str){var h=5381;for(var i=0;i<str.length;i++){h=(h*33+str.charCodeAt(i))%4294967296;}return h;}
  function ORD_rnd(seed){var s=seed||1;return function(){s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
  /* ── 2026-10-09 外教反馈修（RE2 9B2 p29 / 10A1 p5「This activity follows a pattern again」
     「there is a spelling error」）。
     ① 一页里几轮的正确答案位置按 1、2、3、4、1 轮着走，不读题也能猜。ANS_layout：种子取内容哈希
        （同一页每次打开一样），每轮各自重排选项，试 300 种取罚分最低的；ANS_pen 与检查程序
        teacher_feedback_gate.py 同一套判据。
     ② 抢词游戏把释义写成纯文本，&rsquo; 这类符号代码原样露出来；ENT() 先还原成字符。ES5 写法。 */
  function ENT(s){ if(s===null||s===undefined) return ''; s=String(s); if(s.indexOf('&')<0) return s;
    var t=document.createElement('textarea'); t.innerHTML=s; return t.value; }
  function ANS_pen(pos,m){ var L=pos.length,p=0,k,x,y,a,b,d,mm,c={};
    if(L<2) return 0;
    for(k=0;k<L;k++){ c[pos[k]]=(c[pos[k]]||0)+1;
      if(k>1){ x=pos[k-1]-pos[k-2]; y=pos[k]-pos[k-1];
        if(m>=3&&x===y&&(x===1||x===-1)) p+=100;
        if(m>=3&&x===0&&y===0) p+=100; }
      if(k>2){ if(pos[k]===pos[k-2]&&pos[k-1]===pos[k-3]&&pos[k]!==pos[k-1]) p+=100;
        if(m===2&&pos[k]===pos[k-1]&&pos[k-1]===pos[k-2]&&pos[k-2]===pos[k-3]) p+=100;
        if(m>=3){ mm=m; a=((pos[k-2]-pos[k-3])%mm+mm)%mm; b=((pos[k-1]-pos[k-2])%mm+mm)%mm; d=((pos[k]-pos[k-1])%mm+mm)%mm;
          if(a===b&&b===d&&(a===1||a===mm-1)) p+=100; } } }
    a=Math.floor(L/m); b=Math.ceil(L/m);
    for(k=0;k<m;k++){ x=c[k]||0; if(x<a) p+=50*(a-x); if(x>b) p+=50*(x-b); }
    return p; }
  function ANS_layout(rounds,key){
    var n=(rounds||[]).length,m=0,k,t,i,j,x,a,cand,pos,p,best=null,bestP=Infinity; if(!n) return [];
    for(k=0;k<n;k++) m=Math.max(m,(rounds[k].opts||[]).length);
    var rnd=ORD_rnd(ORD_seed('ANS#'+key));
    for(t=0;t<1500;t++){ cand=[]; pos=[];
      for(k=0;k<n;k++){ a=(rounds[k].opts||[]).slice();
        for(i=a.length-1;i>0;i--){ j=Math.floor(rnd()*(i+1)); x=a[i]; a[i]=a[j]; a[j]=x; }
        cand.push(a); pos.push(a.indexOf(rounds[k].ans)); }
      p=ANS_pen(pos,m); if(p<bestP){ bestP=p; best=cand; } if(p===0) break; }
    return best; }
  function ORD_shuffle(list,ansSeq){
    if(!list||list.length<2)return (list||[]).slice();
    ansSeq=ansSeq||[];
    var n=list.length,rnd=ORD_rnd(ORD_seed(list.join('|')+'#'+ansSeq.join('|'))),a=list.slice(),i,j,x,t;
    function clash(arr){for(var k=0;k<arr.length&&k<ansSeq.length;k++){if(arr[k]===ansSeq[k])return true;}return false;}
    for(t=0;t<80;t++){
      a=list.slice();
      for(i=n-1;i>0;i--){j=Math.floor(rnd()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}
      if(!clash(a))return a;
    }
    for(i=0;i<a.length&&i<ansSeq.length;i++){if(a[i]===ansSeq[i]){j=(i+1)%n;x=a[i];a[i]=a[j];a[j]=x;}}
    return a;
  }
  function ORD_gapAns(s){var m=s.answers||{},ks=Object.keys(m).sort(function(x,y){return (+x)-(+y);}),out=[],seen={};
    ks.forEach(function(k){var w=m[k];if(w&&!seen[w]){seen[w]=1;out.push(w);}});return out;}
  /* ── 2026-09-26 外教反馈修（RE2 9B1 p20「The words and definitions are in order」
     「For all the word activities - they are also in order」）。两处病：
     ① 连线 / 排顺序 / 分类 / 翻牌原来用「sort + 随机比较」打乱 —— 不均匀：
        4 组连线约 19% 一行没动，打乱了平均也还有 1.3 组正对着；排顺序 5 项约 9% 一打开就排好了。
     ② 抢词游戏按作者顺序出题，作者顺序 = 前面单词页的教学顺序，学生不读释义也能猜下一题。
     KAI_arrange：种子取内容哈希（同一页每次打开一样，截图可复现），试 200 次洗牌取罚分最低的一种。
     KAI_orderPen(r)：r[k] = 显示第 k 项原来排第几。原位 +10；紧挨的两项保留原来的前后关系
     （正着或倒着）+3；升序步数偏离一半再罚（防「整个倒过来」这类一眼能看出的排法）。ES5 写法。 */
  function KAI_arrange(list,key,pen){
    var n=list.length; if(n<2) return list.slice();
    var rnd=ORD_rnd(ORD_seed(key)),best=list.slice(),bestP=Infinity,t,i,j,x,a,p;
    for(t=0;t<200;t++){ a=list.slice();
      for(i=n-1;i>0;i--){j=Math.floor(rnd()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}
      p=pen(a); if(p<bestP){bestP=p;best=a;} if(p===0)break; }
    return best; }
  function KAI_orderPen(r){ var p=0,up=0,k,n=r.length;
    for(k=0;k<n;k++){ if(r[k]===k) p+=10;
      if(k>0){ if(r[k]===r[k-1]+1||r[k]===r[k-1]-1) p+=3; if(r[k]>r[k-1]) up++; } }
    return p+Math.max(0,Math.abs(up-(n-1)/2)-1); }
  function KAI_taught(){ var out=[],seen={},S=(L&&L.slides)||[];
    S.forEach(function(s){ if(s.type==='spotlight'&&s.w) out.push(s.w);
      if(s.type==='quickset'&&s.words) s.words.forEach(function(x){ out.push(x.w||x); }); });
    if(!out.length) S.forEach(function(s){ if(s.type==='vocabIntro'&&s.words) s.words.forEach(function(x){ out.push(x.w||x); }); });
    return out.filter(function(w){ if(seen[w]) return false; seen[w]=1; return true; }); }
  function KAI_gameRounds(s){ var rs=s.rounds||[]; if(rs.length<3) return s;
    var tau=KAI_taught(), pos=rs.map(function(r){ return tau.indexOf(r.ans); }), up=0, k;
    if(pos.some(function(p){ return p<0; })) return s;
    for(k=1;k<pos.length;k++) if(pos[k]>pos[k-1]) up++;
    if(up/(pos.length-1)<0.75) return s;   // 作者本来就打乱过的不动（有的带课卡写了「第 3 轮」）
    var sorted=pos.slice().sort(function(a,b){ return a-b; }), rk=pos.map(function(p){ return sorted.indexOf(p); });
    var o={},key; for(key in s) o[key]=s[key];
    o.rounds=KAI_arrange(rs.map(function(r,i){ return {r:r,i:i}; }), rs.map(function(r){ return r.ans; }).join('|'),
      function(a){ return KAI_orderPen(a.map(function(x){ return rk[x.i]; })); }).map(function(x){ return x.r; });
    return o; }

  R.hero = (s)=>{ const d=el('div','slide hero '+('bg-'+(s.bg||'peach')));
    d.innerHTML = `${timerPill(s.timer)}<div class="lt">${eyebrow(s.eyebrow)}
      <h1>${rt(s.title)}</h1><div class="sub">${rt(s.sub)}</div>
      <div class="lead">${rt(s.body)}</div></div>
      <div class="rt"><img src="${imgsrc(s.img)}" alt=""></div>`;
    return d; };

  R.journey = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'lemon')));
    let steps='';
    s.steps.forEach((st,i)=>{ steps += `<div class="jstep ${st.state||''}">
        <div class="jn">${rt(st.n)}</div><div class="je">${st.e||'•'}</div>
        <div class="jt">${rt(st.t)}</div></div>`;
      if(i<s.steps.length-1) steps += `<div class="jarrow">→</div>`; });
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow)}<h2>${rt(s.title)}</h2>
      <div class="journey">${steps}</div>
      ${s.note?`<div class="lead" style="margin-top:2.6cqh">${rt(s.note)}</div>`:''}`;
    addBlobs(d,s.bg||'lemon'); return d; };

  R.content = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'peach'))+(s.center?' center':''));
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow)}<h2>${rt(s.title)}</h2>
      <div class="lead"${s.center?' style="margin-left:auto;margin-right:auto"':''}>${rt(s.body)}</div>
      ${s.chips?`<div class="wrap" style="margin-top:2.4cqh"${s.center?' style="justify-content:center"':''}>${s.chips.map(c=>`<span class="chip" style="--cl:${c.cl||'var(--orange-l)'};--c:${c.c||'var(--orange-d)'}">${rt(c.t)}</span>`).join('')}</div>`:''}
      ${s.reveal?`<button class="revealbtn"${s.center?' style="align-self:center"':''}>${rt(s.revealLabel||'Reveal answer ✓')}</button><div class="revealbox"${s.center?' style="margin-left:auto;margin-right:auto"':''}>${rt(s.reveal)}</div>`:''}
      ${discuss(s.discuss)}`;
    addBlobs(d,s.bg||'peach');
    const btn=d.querySelector('.revealbtn'); if(btn) btn.addEventListener('click',()=>d.querySelector('.revealbox').classList.toggle('show'));
    return d; };

  R.guess = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'lemon')));
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow)}<h2>${rt(s.title)}</h2>
      <div class="lead">${rt(s.body||'')}</div>
      <div class="guessrow">${s.items.map(it=>`<div class="gcard" data-g="${it.g}" data-max="${s.max}">
        <div class="ge">${it.e}</div><div class="gn">${rt(it.n)}</div>
        <div class="bar"><i></i></div><div class="gram">${it.g} ${s.unit!==undefined?s.unit:'g sugar'}</div></div>`).join('')}</div>
      <div class="gamemsg"></div>`;
    addBlobs(d,s.bg||'lemon');
    d.querySelectorAll('.gcard').forEach(c=>c.addEventListener('click',()=>{
      const g=+c.dataset.g, max=+c.dataset.max;
      c.classList.add('show'); c.querySelector('.bar>i').style.width=Math.min(100,g/max*100)+'%';
      const cards=[...d.querySelectorAll('.gcard')];
      const top=Math.max(...cards.map(x=>+x.dataset.g));
      if(cards.every(x=>x.classList.contains('show'))){
        cards.forEach(x=>{ if(+x.dataset.g===top) x.classList.add('win'); });
        d.querySelector('.gamemsg').textContent=s.winMsg||'😮 The winner hides the most sugar!';
      }
    }));
    return d; };

  R.videoBefore = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'sky')));
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow)}<h2>${rt(s.title)}</h2>
      <div class="lead">${rt(s.body||'')}</div>
      <div class="grid" style="margin-top:2.4cqh">${s.qs.map((q,i)=>`
        <div class="acard" style="--c:var(--blue);--cl:var(--blue-l)">
          <div class="ic">${['1️⃣','2️⃣','3️⃣','4️⃣'][i]}</div>
          <div class="tx">${rt(q.q)} &nbsp;
            ${q.opts.map(o=>`<span class="chip vopt" data-ok="${o.ok?1:0}" style="--cl:var(--sky);--c:var(--blue-d);font-size:2cqh;padding:.6cqh 1.2cqw">${rt(o.t)}</span>`).join('')}
          </div></div>`).join('')}</div>
      <div class="gamemsg"></div>`;
    addBlobs(d,s.bg||'sky');
    d.querySelectorAll('.vopt').forEach(o=>o.addEventListener('click',()=>{
      const ok=o.dataset.ok==='1'; o.style.setProperty('--cl',ok?'var(--green-l)':'var(--red-l)');
      o.style.setProperty('--c',ok?'var(--green-d)':'var(--red-d)');
      if(ok) o.textContent='✓ '+o.textContent;
    }));
    return d; };

  R.video = (s)=>{ const d=el('div','slide center '+('bg-'+(s.bg||'sky')));
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow)}<h2>${rt(s.title)}</h2>
      <div class="videowrap"><video src="${VID}${s.src}" controls preload="metadata"></video></div>
      ${s.recall?`<div class="lead" style="margin:2cqh auto 0;max-width:60ch">${rt(s.recall)}</div>`:''}`;
    addBlobs(d,s.bg||'sky'); return d; };

  R.vocabIntro = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'peach')));
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow)}<h2>${rt(s.title)}</h2>
      <div class="lead">${rt(s.body||'')}</div>
      <div class="wrap" style="margin-top:2.6cqh">${s.words.map((w,i)=>{
        const cs=['orange','teal','pink','purple','green','amber','blue','red'];const c=cs[i%cs.length];

  R.rank = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'lemon')));
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow||'Rank & justify')}<h2 style="font-size:4.2cqh">${rt(s.title)}</h2>
      <div class="lead">${rt(s.body||'Tap the cards in order — most important first. Tap again to undo. Then defend your ranking!')}</div>
      <div class="wrap" style="margin-top:2cqh;justify-content:center">${s.items.map((it,i)=>`<span class="chip rankit" data-i="${i}" style="--cl:var(--amber-l);--c:var(--amber-d);position:relative">${rt(it)}</span>`).join('')}</div>
      ${discuss(s.discuss||{t:'Defend your top pick',s:'Say why #1 matters most.',starter:'The most important is … because …'})}`;
    addBlobs(d,s.bg||'lemon');
    let order=[]; d.querySelectorAll('.rankit').forEach(c=>c.addEventListener('click',()=>{
      const i=c.dataset.i;
      if(c.dataset.rank){ // undo
        order=order.filter(x=>x!==i); c.removeAttribute('data-rank'); c.style.setProperty('--cl','var(--amber-l)'); c.style.setProperty('--c','var(--amber-d)');
        c.textContent=c.textContent.replace(/^\d+\.\s/,''); renumber();
      } else { order.push(i); c.dataset.rank=order.length; c.style.setProperty('--cl','var(--green)'); c.style.setProperty('--c','#fff');
        c.textContent=order.length+'. '+c.textContent; }
    }));
    function renumber(){ order.forEach((i,idx)=>{ const c=d.querySelector(`.rankit[data-i="${i}"]`); c.dataset.rank=idx+1; c.textContent=(idx+1)+'. '+c.textContent.replace(/^\d+\.\s/,''); }); }
    return d; };

  // 事件排序：按你认为的顺序点，点满后 Check
  R.sequence = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'lilac')));
    const ords=s.items.map(it=>+it.order).sort((a,b)=>a-b);
    const items=KAI_arrange(s.items.map((it,i)=>({...it,i})),s.items.map(it=>it.order+':'+it.t).join('|'),
      a=>KAI_orderPen(a.map(x=>ords.indexOf(+x.order))));
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow||'Put it in order')}<h2 style="font-size:4.2cqh">${rt(s.title)}</h2>
      <div class="lead">${rt(s.body||'Tap the steps in the right order.')}</div>
      <div class="klist" style="margin-top:1.8cqh;max-width:74cqw">${items.map(it=>`<div class="krow seqit" data-o="${it.order}" style="cursor:pointer;background:#fff;border-radius:1.2cqh;padding:1.2cqh 1.4cqw;box-shadow:var(--shadow)">
        <div class="kb seqnum" style="--cl:var(--purple-l);--c:var(--purple-d)">?</div><div>${rt(it.t)}</div></div>`).join('')}</div>
      <button class="revealbtn" style="background:var(--purple)">Check order ✓</button>
      <div class="gamemsg"></div>`;
    addBlobs(d,s.bg||'lilac');
    let n=0; const msg=d.querySelector('.gamemsg');
    d.querySelectorAll('.seqit').forEach(r=>r.addEventListener('click',()=>{
      if(r.dataset.pick) return; n++; r.dataset.pick=n; r.querySelector('.seqnum').textContent=n; }));
    d.querySelector('.revealbtn').addEventListener('click',()=>{
      let ok=true; d.querySelectorAll('.seqit').forEach(r=>{ const good=(+r.dataset.pick===+r.dataset.o);
        r.querySelector('.seqnum').style.background=good?'var(--green-l)':'var(--red-l)';
        r.querySelector('.seqnum').style.color=good?'var(--green-d)':'var(--red-d)';
        if(!good){ok=false; r.querySelector('.seqnum').textContent=r.dataset.o;} });
      msg.textContent = ok?'🎉 Perfect order!':'Close — green = right, red shows the correct number.'; });
    return d; };

  // 判断 True/False（或 Fact/Opinion）
  R.truefalse = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'mint')));
    const L1=s.labels?s.labels[0]:'True', L2=s.labels?s.labels[1]:'False';
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow||'True or false?')}<h2 style="font-size:4.2cqh">${rt(s.title)}</h2>
      <div class="klist" style="margin-top:1.8cqh;max-width:82cqw">${s.statements.map((q,i)=>`
        <div class="card tfrow" data-ans="${q.ans?1:0}" style="display:flex;align-items:center;gap:1.4cqw;padding:1.6cqh 1.6cqw">
          <div style="flex:1;font-size:2.4cqh;color:var(--ink)">${rt(q.t)}</div>
          <span class="chip tf" data-v="1" style="--cl:var(--green-l);--c:var(--green-d)">${L1}</span>
          <span class="chip tf" data-v="0" style="--cl:var(--red-l);--c:var(--red-d)">${L2}</span>
          <div class="why" style="font-size:1.8cqh;color:var(--ink-soft);max-width:22cqw;opacity:0;transition:opacity .3s">${rt(q.why||'')}</div>
        </div>`).join('')}</div>`;
    addBlobs(d,s.bg||'mint');
    d.querySelectorAll('.tfrow').forEach(row=>{ const ans=row.dataset.ans;
      row.querySelectorAll('.tf').forEach(b=>b.addEventListener('click',()=>{
        const ok=b.dataset.v===ans; b.style.setProperty('--cl',ok?'var(--green)':'var(--red)'); b.style.setProperty('--c','#fff');
        row.querySelector('.why').style.opacity=1; row.querySelectorAll('.tf').forEach(x=>x.style.pointerEvents='none');
        if(!ok){ const good=row.querySelector(`.tf[data-v="${ans}"]`); good.style.setProperty('--cl','var(--green)'); good.style.setProperty('--c','#fff'); }
      })); });
    return d; };

  // 记忆翻牌配对（词 ↔ 义/图）
  R.memory = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'rose')));
    let cards=[]; s.pairs.forEach((p,i)=>{ cards.push({k:i,t:p.a,face:'a'}); cards.push({k:i,t:p.b,face:'b'}); });
    { const nC=cards.length, cC=nC<=6?3:(nC<=8?4:(nC<=12?4:5));  // 列数公式与下面 cols 一致
      cards=KAI_arrange(cards.map((c,i)=>({...c,i})),s.pairs.map(p=>p.a+'='+p.b).join('|'),a=>{ let p=0;
        a.forEach((x,k)=>{ if(x.i===k) p+=2; const r=a[k+1], dn=a[k+cC];
          if(r&&(k+1)%cC!==0&&r.k===x.k) p+=10; if(dn&&dn.k===x.k) p+=10; }); return p; }); }
    // 2026-08-14 实测：16 张退回 4 列会变成 4 行，反而顶到翻页条上（overlap_check 实测 6094 > 1500）。
    // 所以**引擎不动**，回到原判据；「末行别只剩一张」改成出题时的约束：
    // 翻牌页的牌数按 5 列排要么整除、要么余数 ≥2（如 14 张 = 5/5/4）。
    const cols = cards.length<=8?4:(cards.length<=12?4:5);
    d.innerHTML = `<div class="scorepill">🧩 <span class="mp">0</span>/${s.pairs.length}</div>
      ${eyebrow(s.eyebrow||'Memory match · flip two cards')}<h2 style="font-size:4cqh">${rt(s.title||'Find the pairs')}</h2>
      <div class="grid memgrid" style="grid-template-columns:repeat(${cols},1fr);gap:1.4cqh 1.2cqw;margin-top:2cqh;flex:1;min-height:0">
        ${cards.map(c=>`<div class="mcard" data-k="${c.k}" data-i="${c.i}" data-f="${c.face}" style="position:relative;cursor:pointer;aspect-ratio:1.55">
          <div class="mface mback" style="position:absolute;inset:0;background:var(--purple);border-radius:1.4cqh;display:flex;align-items:center;justify-content:center;font-size:3.4cqh;color:#fff;box-shadow:var(--shadow)">?</div>
          <div class="mface mfront" style="position:absolute;inset:0;background:#fff;border-radius:1.4cqh;display:flex;align-items:center;justify-content:center;text-align:center;padding:.6cqh .8cqw;font-size:1.9cqh;font-weight:700;color:var(--ink);box-shadow:var(--shadow);opacity:0;line-height:1.15">${rt(c.t)}</div>
          <div class="mtimer" style="position:absolute;left:10%;right:10%;bottom:.7cqh;height:.5cqh;border-radius:99px;background:var(--red);opacity:0;transform:scaleX(1);transform-origin:left center;z-index:3;pointer-events:none"></div></div>`).join('')}
      </div><div class="gamemsg"></div>
      <div class="memfb" style="position:absolute;left:50%;transform:translateX(-50%);bottom:9.5cqh;z-index:4;padding:.7cqh 1.8cqw;border-radius:99px;font-size:2.2cqh;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;box-shadow:var(--shadow)"></div>`;
    addBlobs(d,s.bg||'rose');
    // 2026-09-01 老师上完 8A1 的原话：学生很爱玩，但「翻错的两张扣回去太快，来不及读、也来不及对」。
    // 原来是一刀切 setTimeout 800ms —— 一个词 + 一句释义 800ms 读不完，这题就退化成「背位置」，
    // 不是「读词 → 读义 → 判断配不配」。改三处，少一条都不算修好：
    //  ① 停留时间按两张牌的实际字数算（短词对 ≈3.4s，长释义对 ≈4.5s，封顶 6s），不再是固定值；
    //  ② 停留期间两张牌打红圈 + 牌底走一条倒计时条 —— 原来是无声消失，学生只知道「没了」，
    //     不知道「这两个不配」，也不知道还剩多久（倒计时画在牌上，不占版面高度，不动 overlap 判据）；
    //  ③ 读完点屏幕任意处（或直接点下一张牌）立刻翻回，快的学生不被慢速拖着走。
    // 配对成功时把「词 = 义」回显出来，让全班把这一对读出来，而不是只看到分数 +1。
    // 反馈条走 .memfb 这个浮层，**不走 .gamemsg**：.gamemsg 在 memgrid（flex:1）之后，实测
    // 一有字就压在 #nav 翻页条上（1280/1366/1920 三视口归一化 3297/3307/3303，阈值 1500）。
    // 原来只有终局那句「🎉 All matched!」走这里、一节课出现一次，所以从没被量到；
    // 现在每翻错一次都要出字，压着翻页条的提示等于没提示。
    const READ_MIN=1800, READ_PER_CHAR=60, READ_MAX=6000;
    const readMs=(a,b)=>Math.min(READ_MAX, READ_MIN+((a||'').length+(b||'').length)*READ_PER_CHAR);
    const face=x=>x.querySelector('.mfront');
    const fb=d.querySelector('.memfb');
    const say=(t,bad)=>{ if(!t){ fb.style.opacity=0; fb.textContent=''; return; }
      fb.textContent=t; fb.style.color=bad?'var(--red-d)':'var(--green-d)';
      fb.style.background=bad?'var(--red-l)':'var(--green-l)'; fb.style.opacity=1; };
    let open=[], matched=0, lock=false, pending=null;
    const flipBack=()=>{ if(!pending) return; const p=pending; pending=null;
      clearTimeout(p.t); d.removeEventListener('pointerdown',p.h,true);
      p.cards.forEach(x=>{ const f=face(x), tm=x.querySelector('.mtimer');
        f.style.opacity=0; f.style.boxShadow='var(--shadow)'; x.querySelector('.mback').style.opacity=1;
        tm.style.transition='none'; tm.style.opacity=0; tm.style.transform='scaleX(1)'; x.classList.remove('up'); });
      say(''); open=[]; lock=false; };
    d.querySelectorAll('.mcard').forEach(c=>c.addEventListener('click',()=>{
      if(lock||c.dataset.done||c.classList.contains('up'))return;
      face(c).style.opacity=1; c.querySelector('.mback').style.opacity=0; c.classList.add('up'); open.push(c);
      if(open.length===2){ lock=true; const pair=open.slice();
        if(pair[0].dataset.k===pair[1].dataset.k){ pair.forEach(x=>{x.dataset.done=1;x.style.pointerEvents='none';face(x).style.background='var(--green-l)';});
          matched++; d.querySelector('.mp').textContent=matched; open=[]; lock=false;
          const A=pair.find(x=>x.dataset.f==='a')||pair[0], B=pair.find(x=>x.dataset.f==='b')||pair[1];
          say(matched===s.pairs.length ? '🎉 All matched!' : `✓ ${face(A).textContent} = ${face(B).textContent}`, false);
        } else {
          const ms=readMs(face(pair[0]).textContent, face(pair[1]).textContent);
          pair.forEach(x=>{ face(x).style.boxShadow='0 0 0 .4cqh var(--red), var(--shadow)';
            const tm=x.querySelector('.mtimer');
            // 先归位再强制回流（读 offsetWidth），倒计时条才会真的走完 ms —— 用 rAF 在后台标签页里
            // 会被浏览器暂停，条不动而牌照样翻回去，等于又变回「猝不及防」。
            tm.style.transition='none'; tm.style.transform='scaleX(1)'; tm.style.opacity=1; void tm.offsetWidth;
            tm.style.transition=`transform ${ms}ms linear`; tm.style.transform='scaleX(0)'; });
          say('✗ Not a pair — read both, then tap anywhere', true);
          const h=()=>flipBack();
          pending={cards:pair, h, t:setTimeout(flipBack, ms)};
          d.addEventListener('pointerdown',h,true);
        }
      } }));
    return d; };

  // 整幅图页（地图 / 信息图）：图占大半屏，说明在下方——图内文字必须在投屏上看得清
  R.figure = (s)=>{ const d=el('div','slide figpage '+('bg-'+(s.bg||'sky')));
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow)}
      ${s.title?`<h2 style="font-size:3.6cqh">${rt(s.title)}</h2>`:''}
      <div class="figwrap"><img src="${imgsrc(s.img)}" alt=""></div>
      ${s.caption?`<div class="figcap">${rt(s.caption)}</div>`:''}`;
    addBlobs(d,s.bg||'sky'); return d; };

  // ---------- 段后题三件套（2026-07-31 加，配方：词汇钉概念 / 用法开口 / 一段一策略） ----------
  // 单题大卡点选，答对后弹讲解条。答案不在初始页面。
  R.quiz = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'sky')));
    const c=s.c||'teal';
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow||'Check')}<h2 style="font-size:4.2cqh">${rt(s.title)}</h2>
      <div class="lead" style="margin-top:1.2cqh">${rt(s.q)}</div>
      <div class="qzopts" data-ans="${s.ans}">${s.opts.map(o=>`
        <button class="qzopt" data-k="${o.k}"><span class="qzk" style="background:var(--${c}-l);color:var(--${c}-d)">${o.k}</span><span>${rt(o.t)}</span></button>`).join('')}</div>
      ${s.note?`<div class="qznote">✨ ${rt(s.note)}</div>`:''}`;
    addBlobs(d,s.bg||'sky');
    const box=d.querySelector('.qzopts'), note=d.querySelector('.qznote');
    box.querySelectorAll('.qzopt').forEach(b=>b.addEventListener('click',()=>{
      if(box.classList.contains('done')) return;
      if(b.dataset.k===box.dataset.ans){ b.classList.add('right'); box.classList.add('done'); if(note) note.classList.add('show'); }
      else { b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),480); }
    }));
    return d; };

  // 点选 N 个能搭配的词（搭配练习）
  R.pick2 = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'mint')));
    const need=s.need||2;
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow||'Collocation')}<h2 style="font-size:4.2cqh">${rt(s.title)}</h2>
      <div class="lead" style="margin-top:1.2cqh">${rt(s.q)}</div>
      <div class="pickrow" data-need="${need}">${s.words.map(w=>`<button class="pkchip" data-ok="${w.ok?1:0}">${w.w}</button>`).join('')}</div>
      <div class="gamemsg"></div>`;
    addBlobs(d,s.bg||'mint');
    const msg=d.querySelector('.gamemsg'); let got=0;
    d.querySelectorAll('.pkchip').forEach(c=>c.addEventListener('click',()=>{
      if(c.classList.contains('right')) return;
      if(c.dataset.ok==='1'){ c.classList.add('right'); got++;
        msg.textContent = got>=need ? '✓ All found!' : 'One more…'; }
      // 默认保持搭配题的原文案（改默认值会把别的单元 8 处真搭配题的提示降级 —— 2026-08-14 DECK-38），
      // 非搭配类的 pick2 自己传 wrongMsg（2026-08-14 DECK-26）。
      else { c.classList.add('wrong'); msg.textContent = s.wrongMsg || 'That word can’t follow it — try again';
        setTimeout(()=>c.classList.remove('wrong'),480); }
    }));
    return d; };

  // 口语句框 + 词池（≥4 词产出）
  R.speak = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'lemon')));
    d.innerHTML = `${timerPill(s.timer)}${eyebrow(s.eyebrow||'Your turn')}<h2 style="font-size:4.2cqh">${rt(s.title)}</h2>
      ${s.pool?`<div class="wrap" style="margin-top:1.8cqh;justify-content:center">${s.pool.map(w=>`<span class="chip spword" style="--cl:var(--teal-l);--c:var(--teal-d)">${w}</span>`).join('')}</div>`:''}
      <div class="spkcard"><div class="spkmic">🎤</div><div class="spkframe">${rt(s.frame)}</div></div>
      <div class="spkrule">✎ ${rt(s.rule||'Say at least 4 words. Your own words — don’t copy the text!')}</div>`;
    addBlobs(d,s.bg||'lemon');
    d.querySelectorAll('.spword').forEach(c=>c.addEventListener('click',()=>{
      d.querySelectorAll('.spword').forEach(x=>x.classList.remove('picked')); c.classList.add('picked'); }));
    return d; };

  // ---------- 装配 ----------
  L.slides.forEach((s,i)=>{ const fn=R[s.type]||R.content; const node=fn(s); node.dataset.i=i; deck.appendChild(node);
    const dot=el('div','dot'); dot.addEventListener('click',()=>go(i)); dotsEl.appendChild(dot); });
  badgeEl.textContent = L.id + ' · ' + L.title;

  const slides=[...deck.querySelectorAll('.slide')], dots=[...dotsEl.children];
  function go(n){ cur=Math.max(0,Math.min(N-1,n));
    slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
    dots.forEach((d,i)=>d.classList.toggle('on',i===cur));
    // 暂停非当前页视频
    deck.querySelectorAll('video').forEach(v=>{ if(!v.closest('.slide').classList.contains('active')) v.pause(); });
  }
  const startAt=(()=>{ const m=/[?&]s=(\d+)/.exec(location.search); return m?(+m[1]-1):0; })();
  go(startAt);
  document.getElementById('prev').addEventListener('click',()=>go(cur-1));
  document.getElementById('next').addEventListener('click',()=>go(cur+1));
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);
    if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1); });
})();

</script>
</body></html>
