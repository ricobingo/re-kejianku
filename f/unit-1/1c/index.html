<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1C · Moon Mystery</title>
<style>
/* ============================================================
   KAI · RE2 交互课件设计系统 (bright / kid-first)
   给 12–15 岁孩子：明亮、卡片化、有游戏感。ClassIn 投屏 16:9。
   字体走 Comic Sans MS（Rico 课件铁律 §10），配色出力气。
   布局用 container query 单位 (cqw/cqh)，随舞台缩放不爆框。
   ============================================================ */
:root{
  --orange:#FF7A3D; --orange-d:#EA5B22; --orange-l:#FFE3CE;
  --teal:#12897E;   --teal-d:#0C6A62;   --teal-l:#CDEBE6;
  --pink:#EC4B93;   --pink-d:#D22E78;   --pink-l:#FBD7E8;
  --purple:#8B5CF6; --purple-d:#6D3EE0; --purple-l:#E7DEFB;
  --green:#22B573;  --green-d:#189259;  --green-l:#CDEFDD;
  --amber:#F6A623;  --amber-d:#D8860A;  --amber-l:#FCE7BE;
  --blue:#3D8BFF;   --blue-d:#2168DB;   --blue-l:#D5E6FF;
  --red:#EF4B4B;    --red-d:#CE2E2E;    --red-l:#FBD6D6;
  --ink:#2B2A33; --ink-soft:#5A5866; --line:#EDE7DE;
  --round: "Comic Sans MS","Chalkboard SE","Comic Neue",-apple-system,"PingFang SC",sans-serif;
  --shadow: 0 .9cqh 2.4cqh rgba(60,40,20,.14);
  --shadow-lift: 0 1.6cqh 3.6cqh rgba(60,40,20,.2);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--round);background:#0e1116;overflow:hidden;-webkit-font-smoothing:antialiased}

/* 舞台：16:9 letterbox，container 供 cqw/cqh */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{position:relative;aspect-ratio:16/9;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
  container-type:size;overflow:hidden;border-radius:1.2cqh;background:#fff}

.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
  padding:6.5cqh 6cqw;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.slide.active{opacity:1;visibility:visible}
.slide.center{align-items:center;text-align:center}

/* ---- 背景色板 + 柔和色斑 blob ---- */
.bg-peach{background:#FFF4E7}.bg-mint{background:#EAF7F1}.bg-sky{background:#EEF4FF}
.bg-lemon{background:#FFF8E2}.bg-lilac{background:#F4EFFF}.bg-rose{background:#FFF0F5}
.bg-dark{background:#20303A;color:#EAF3F2}
.blob{position:absolute;border-radius:50%;filter:blur(.2cqh);z-index:0;pointer-events:none}
.slide>*{position:relative;z-index:1}
/* blob 必须压在内容下面：.slide>.blob 特异性(0,2,0) 高于 .slide>*(0,1,0)，
   否则 .slide>* 会把 blob 改成 relative+z1 顶到内容上面（粉色遮挡 bug 2026-07-29） */
.slide>.blob{position:absolute;z-index:0}

/* ---- 文字 ---- */
.eyebrow{display:inline-flex;align-items:center;gap:.5cqw;align-self:flex-start;
  font-size:1.7cqh;font-weight:700;letter-spacing:.03em;color:var(--teal-d);
  background:var(--teal-l);padding:.7cqh 1.4cqw;border-radius:999px}
.center .eyebrow{align-self:center}
h1{font-size:8cqh;line-height:1.02;color:var(--ink);letter-spacing:-.01em;font-weight:700}
h2{font-size:5.4cqh;line-height:1.05;color:var(--ink);margin-top:1cqh;font-weight:700}
h3{font-size:3.4cqh;line-height:1.1;color:var(--ink)}
.lead{font-size:2.7cqh;line-height:1.42;color:var(--ink-soft);max-width:44ch;margin-top:2cqh}
.big{font-size:3.4cqh;line-height:1.35;color:var(--ink)}
.muted{color:var(--ink-soft)}
b,strong{color:inherit;font-weight:700}
.hl-o{color:var(--orange-d)}.hl-p{color:var(--pink-d)}.hl-t{color:var(--teal-d)}
.hl-pu{color:var(--purple-d)}.hl-g{color:var(--green-d)}.hl-b{color:var(--blue-d)}

/* 顶部计时药丸 + 课号 */
.timer{position:absolute;top:5cqh;right:5cqw;z-index:3;display:inline-flex;align-items:center;gap:.6cqw;
  background:#fff;border:.35cqh solid var(--amber-l);color:var(--amber-d);font-weight:700;font-size:1.9cqh;
  padding:.8cqh 1.5cqw;border-radius:999px;box-shadow:var(--shadow)}
#badge{position:absolute;top:5cqh;left:5cqw;z-index:0;pointer-events:none;font-size:1.7cqh;font-weight:700;color:#B9AE9C;letter-spacing:.06em}/*badge-below-2026-08-18*/

/* ---- nav ---- */
#nav{position:fixed;bottom:2cqh;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:1.2cqw}
.navbtn{width:5.4cqh;height:5.4cqh;border-radius:50%;border:none;background:rgba(20,20,30,.32);color:#fff;
  font-size:2.6cqh;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.navbtn:hover{background:rgba(20,20,30,.6)}
#dots{display:flex;gap:.55cqw;flex-wrap:wrap;max-width:64cqw;justify-content:center}
.dot{width:1.05cqh;height:1.05cqh;border-radius:50%;background:rgba(20,20,30,.22);cursor:pointer}
.dot.on{background:var(--orange);transform:scale(1.5)}

/* ---- cards ---- */
.card{background:#fff;border-radius:2.4cqh;box-shadow:var(--shadow);padding:3cqh 2.4cqw}
.grid{display:grid;gap:2cqh 1.8cqw}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.row{display:flex;gap:1.8cqw;align-items:center}
.wrap{display:flex;flex-wrap:wrap;gap:1.4cqh 1.2cqw}

/* accent-bar 列表卡（"我们要读什么"） */
.acard{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:1.8cqh;
  padding:1.8cqh 1.8cqw;box-shadow:var(--shadow);border-left:.9cqw solid var(--c,var(--orange))}
.acard .ic{width:6cqh;height:6cqh;flex:none;border-radius:50%;background:var(--cl,var(--orange-l));
  display:flex;align-items:center;justify-content:center;font-size:3cqh}
.acard .tx{font-size:2.5cqh;font-weight:700;color:var(--ink)}

/* 编号圆牌 */
.numbadge{width:5.4cqh;height:5.4cqh;border-radius:50%;background:var(--c,var(--orange));color:#fff;
  font-size:2.4cqh;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.catlabel{font-size:1.9cqh;font-weight:700;letter-spacing:.05em;color:var(--c,var(--orange));text-transform:uppercase}

/* pill / chip */
.pill{display:inline-flex;align-items:center;gap:.5cqw;background:#fff;border-radius:999px;padding:.7cqh 1.4cqw;
  font-size:1.9cqh;font-weight:700;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:.5cqw;background:var(--cl,#fff);color:var(--c,var(--ink));
  border-radius:999px;padding:1cqh 1.8cqw;font-size:2.3cqh;font-weight:700;cursor:pointer;user-select:none;
  border:.35cqh solid transparent;transition:transform .12s}
.chip:hover{transform:translateY(-.5cqh)}

/* hint 盒 */
.hintbox{margin-top:auto;background:var(--cl,var(--amber-l));border-radius:1.4cqh;padding:1.3cqh 1.4cqw;
  font-size:1.9cqh;font-weight:700;color:var(--c,var(--amber-d));display:flex;gap:.7cqw;align-items:flex-start}

/* discuss / sentence-starter bar */
.discuss{margin-top:2.6cqh;background:#fff;border-radius:1.8cqh;box-shadow:var(--shadow);
  padding:1.8cqh 2cqw;display:flex;align-items:center;gap:1.6cqw}
.discuss .avs{display:flex}
.discuss .av{width:4.6cqh;height:4.6cqh;border-radius:50%;color:#fff;font-weight:700;font-size:2.1cqh;
  display:flex;align-items:center;justify-content:center;margin-left:-1cqw;border:.4cqh solid #fff}
.discuss .av:first-child{margin-left:0}
.discuss .lab .t{font-size:2.4cqh;font-weight:700;color:var(--ink)}
.discuss .lab .s{font-size:1.8cqh;color:var(--ink-soft)}
.starter{margin-left:auto;background:#F1F3F7;border-radius:1.2cqh;padding:1.2cqh 1.6cqw;font-size:2.1cqh;color:var(--ink-soft);font-style:italic}

/* ---- hero ---- */
.hero{padding:0;flex-direction:row;align-items:stretch}
.hero .lt{flex:1.15;display:flex;flex-direction:column;justify-content:center;padding:8cqh 5cqw}
.hero .rt{flex:1;position:relative;overflow:hidden}
.hero .rt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .sub{font-size:4.4cqh;font-weight:700;color:var(--orange-d);margin-top:.4cqh}

/* journey */
.journey{display:flex;gap:1.4cqw;margin-top:3.2cqh}
.jstep{flex:1;background:#fff;border-radius:1.8cqh;padding:2.4cqh 1.2cqw;text-align:center;box-shadow:var(--shadow);position:relative}
.jstep .jn{font-size:1.7cqh;font-weight:700;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase}
.jstep .je{font-size:4.4cqh;margin:.6cqh 0}
.jstep .jt{font-size:2.2cqh;font-weight:700;color:var(--ink);line-height:1.15}
.jstep.now{background:var(--orange);color:#fff}
.jstep.now .jn,.jstep.now .jt{color:#fff}
.jstep.done{background:var(--green-l)}
.jarrow{align-self:center;font-size:3cqh;color:#C9BEAE}

/* video */
.videowrap{margin:2.4cqh auto 0;width:64%;aspect-ratio:16/9;border-radius:2cqh;overflow:hidden;background:#000;box-shadow:var(--shadow-lift)}
.videowrap video{width:100%;height:100%;object-fit:cover;display:block}

/* reading paragraph */
.reading{flex-direction:row;gap:3cqw;align-items:center;justify-content:center}
.reading .txt{width:52%;flex:none}
.reading .para{font-size:2.9cqh;line-height:1.5;color:var(--ink)}
.reading .pic{width:42%;flex:none;position:relative;border-radius:2.2cqh;overflow:hidden;box-shadow:var(--shadow);height:74cqh;align-self:center}
.reading .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
mark{background:var(--amber-l);color:var(--orange-d);padding:0 .18em;border-radius:.3em;font-weight:700}
.parabadge{display:inline-flex;align-items:center;gap:.6cqw;font-size:2.1cqh;font-weight:700;color:#fff;
  background:var(--c,var(--teal));border-radius:999px;padding:.7cqh 1.5cqw;margin-bottom:1.4cqh}

/* reveal button + box (答案点击揭晓) */
.revealbtn{align-self:flex-start;margin-top:2.2cqh;background:var(--orange);color:#fff;border:none;cursor:pointer;
  font-family:var(--round);font-size:2.2cqh;font-weight:700;padding:1.1cqh 2.2cqw;border-radius:1.2cqh;box-shadow:var(--shadow)}
.revealbtn:active{transform:scale(.97)}
.revealbox{margin-top:2cqh;background:var(--green-l);border-left:.8cqw solid var(--green);border-radius:1.2cqh;
  padding:1.8cqh 2cqw;font-size:2.5cqh;font-weight:700;color:var(--green-d);
  max-height:0;opacity:0;overflow:hidden;transition:max-height .4s,opacity .3s,padding .3s;padding-top:0;padding-bottom:0}
.revealbox.show{max-height:40cqh;opacity:1;padding-top:1.8cqh;padding-bottom:1.8cqh}

/* ---- 词汇翻卡 ---- */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1.8cqh 1.6cqw;margin-top:2.4cqh;flex:1;min-height:0;padding-bottom:8cqh}
/* 2026-08-18 Rico 点头后加的 padding-bottom：`#nav` 是 position:fixed（bottom:2cqh + 高约 4.6cqh），
   而 .vgrid 是 flex:1 填满高度，底行的下沿永远压在翻页条那条带上 —— 1920×1080 实测第 4 张卡
   右下角擦进 #nav 4px，`check_clickable.py` 判 FAIL。这条 bug 今天逼出过三次绕路
   （八张翻卡拆成 4+4、翻牌 4 对补到 6 对、本条）。**射程可静态证明 = 只有一副课件**：
   `.vgrid` 只在 `R.vocabFlip` 里出现，而全工程只有 `RE Foundation/Unit06/6C.html` 用 vocabFlip。 */
.flip{perspective:1400px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:1.8cqh;overflow:hidden;box-shadow:var(--shadow)}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.front .lab{position:absolute;left:0;right:0;bottom:0;padding:1.4cqh 1.2cqw;
  background:linear-gradient(0deg,rgba(20,15,10,.86),transparent);color:#fff}
.front .w{font-size:3cqh;font-weight:700}
.front .ipa{font-size:1.7cqh;opacity:.9}
.front .tapme{position:absolute;top:1.2cqh;right:1.2cqw;background:rgba(255,255,255,.9);color:var(--orange-d);
  font-size:1.5cqh;font-weight:700;padding:.5cqh 1cqw;border-radius:999px}
.back{background:#fff;transform:rotateY(180deg);padding:2.2cqh 1.6cqw;display:flex;flex-direction:column;justify-content:center;gap:1cqh}
.back .w{font-size:2.6cqh;font-weight:700;color:var(--orange-d)}
.back .def{font-size:2.1cqh;color:var(--ink);line-height:1.3}
.back .ex{font-size:2cqh;color:var(--ink-soft);font-style:italic;border-top:.3cqh solid var(--line);padding-top:1cqh}
.back .ccq{font-size:1.8cqh;color:var(--teal-d);font-weight:700}

/* quick-set 卡 */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqh 1.8cqw;margin-top:2.4cqh}
.qcard{background:#fff;border-radius:1.6cqh;padding:1.8cqh 1.6cqw;box-shadow:var(--shadow);border-left:.7cqw solid var(--c,var(--purple))}
.qcard .w{font-size:2.6cqh;font-weight:700;color:var(--ink)}
.qcard .w small{font-style:italic;color:var(--ink-soft);font-weight:400;font-size:1.7cqh;margin-left:.6cqw}
.qcard .d{font-size:2cqh;color:var(--ink-soft);margin-top:.5cqh;line-height:1.3}

/* ---- 游戏：多选/配对 ---- */
.game-def{font-size:4cqh;font-weight:700;color:var(--ink);text-align:center;margin:1cqh auto 0;max-width:26ch;min-height:9cqh;
  display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqh 1.8cqw;max-width:64cqw;margin:2.4cqh auto 0}
.opt{background:#fff;border:.5cqh solid transparent;border-radius:1.6cqh;padding:2.2cqh 1.4cqw;font-size:2.6cqh;font-weight:700;
  color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;text-align:center;font-family:var(--round)}
.opt:hover{transform:translateY(-.6cqh)}
.opt.right{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.opt.wrong{background:var(--red-l);border-color:var(--red);color:var(--red-d);animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
.scorepill{position:absolute;top:5cqh;right:5cqw;z-index:3;background:var(--green);color:#fff;
  font-size:2.1cqh;font-weight:700;padding:.7cqh 1.6cqw;border-radius:999px;box-shadow:var(--shadow)}
.gamemsg{text-align:center;font-size:2.4cqh;font-weight:700;color:var(--green-d);margin-top:2cqh;min-height:3cqh}
/* 空的提示条不许占位、更不许压在卡片上：翻牌页底排四张牌下缘约 10% 被它盖住，三视口都点不动
   （2026-08-14 第五轮 DECK-62）。它有内容时照旧显示，`min-height` 只在有字时才需要。 */
.gamemsg:empty{min-height:0;margin-top:0;pointer-events:none}
/* 翻牌页底排的牌下缘会伸到固定翻页条 #nav 底下（实测越界约 6px，三视口都点不动）——
   给牌阵留出翻页条的高度（2026-08-14 第五轮 DECK-62）。
   注意：`overlap_check.py` 抓不到这一类，它只比**有文字的**元素，而翻牌背面是空的。 */
.memgrid{padding-bottom:7cqh;align-content:start;grid-auto-rows:minmax(0,1fr)}
/* 牌用 `aspect-ratio` 定高，行高不够时会**溢出到行外**（这才是压到翻页条上的真原因，
   只加 padding 挡不住）。在翻牌页里让牌**填满所在行**、不再按比例撑高。 */
.memgrid .mcard{aspect-ratio:auto;height:100%;min-height:0}

/* ---- 猜糖游戏 / 揭晓卡 ---- */
.guessrow{display:flex;gap:2cqw;margin-top:3cqh;justify-content:center}
.gcard{flex:1;max-width:26cqw;background:#fff;border-radius:2cqh;padding:2.6cqh 1.4cqw 2cqh;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.gcard:hover{transform:translateY(-.8cqh)}
.gcard .ge{font-size:6.5cqh;line-height:1}
.gcard .gn{font-size:2.3cqh;font-weight:700;color:var(--ink);margin-top:1cqh}
.gcard .bar{height:1.6cqh;background:#EEE;border-radius:999px;margin-top:1.6cqh;overflow:hidden}
.gcard .bar>i{display:block;height:100%;width:0;background:var(--orange);transition:width .9s ease;border-radius:999px}
.gcard .gram{font-size:2.2cqh;font-weight:700;color:var(--orange-d);margin-top:.8cqh;opacity:0;transition:opacity .4s}
.gcard.show .gram{opacity:1}
.gcard.win{outline:.6cqh solid var(--green);outline-offset:-.6cqh}

/* poll (good/bad predict) */
.pollrow{display:flex;gap:2.4cqw;margin-top:3cqh;justify-content:center}
.pollcard{flex:1;max-width:32cqw;background:#fff;border-radius:2cqh;padding:3cqh 1.6cqw;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;border:.6cqh solid transparent;transition:transform .14s}
.pollcard:hover{transform:translateY(-.8cqh)}
.pollcard .pe{font-size:6cqh}
.pollcard .pt{font-size:3cqh;font-weight:700;margin-top:1cqh}
.pollcard .cnt{font-size:2cqh;color:var(--ink-soft);margin-top:.8cqh}
.pollcard.picked{border-color:var(--orange)}

/* gap-fill */
.gaptext{font-size:3cqh;line-height:1.7;color:var(--ink);max-width:52ch}
.blank{display:inline-flex;min-width:9cqw;justify-content:center;border-bottom:.5cqh dashed var(--orange);
  color:var(--orange-d);font-weight:700;padding:0 .4cqw}
.blank.filled{border-bottom-style:solid;background:var(--green-l);border-radius:.4em .4em 0 0}

/* exit recap */
.recap{display:flex;gap:2.4cqw;margin-top:3.4cqh}
.rc{flex:1;background:#fff;border-radius:2cqh;padding:3cqh 1.6cqw;text-align:center;box-shadow:var(--shadow)}
.rc .n{font-size:6cqh;font-weight:700;color:var(--orange-d)}
.rc .t{font-size:2.1cqh;color:var(--ink-soft);margin-top:.6cqh}

/* checklist / list */
.klist{margin-top:2.4cqh;display:flex;flex-direction:column;gap:1.4cqh}
.krow{display:flex;align-items:center;gap:1.2cqw;font-size:2.5cqh;color:var(--ink)}
.krow .kb{width:4.4cqh;height:4.4cqh;flex:none;border-radius:1cqh;background:var(--cl,var(--teal-l));
  color:var(--c,var(--teal-d));display:flex;align-items:center;justify-content:center;font-size:2.3cqh;font-weight:700}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{opacity:0;transform:translateY(2cqh)}
.pop.in{animation:pop .5s forwards}
.pop.d2{animation-delay:.12s}.pop.d3{animation-delay:.24s}.pop.d4{animation-delay:.36s}
@keyframes pop{to{opacity:1;transform:none}}

/* ===== 段后题三件套（2026-07-31）：quiz / pick2 / speak ===== */
/* 注意：class 名不得叫 frame（与舞台全局撞名）——命名前 grep 查重 */
.qzopts{display:flex;flex-direction:column;gap:1.4cqh;margin-top:2.2cqh;max-width:74cqw}
.qzopt{display:flex;align-items:center;gap:1.2cqw;background:#fff;border:.35cqh solid transparent;border-radius:1.6cqh;
  padding:1.7cqh 1.8cqw;font:inherit;font-size:2.5cqh;color:var(--ink);text-align:left;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .16s,border-color .16s;min-height:44px}
.qzopt:hover{transform:translateY(-.4cqh)}

.qzopt.right{border-color:var(--green);background:var(--green-l)}

.qzopt.wrong{border-color:var(--red);background:var(--red-l);animation:shake .4s}
.qzopt.wrong::after{content:'✕';margin-left:auto;color:var(--red-d);font-weight:700;font-size:2.4cqh}
.qzopts.done .qzopt{pointer-events:none}

.pickrow{display:flex;flex-wrap:wrap;gap:1.6cqw;margin-top:2.6cqh}
.pkchip{background:#fff;border:.35cqh solid transparent;border-radius:1.4cqh;padding:1.5cqh 2.4cqw;

.pkchip.right{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.pkchip.right::after{content:' ✓'}
.pkchip.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d);animation:shake .4s}

.chip.spword{cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.chip.spword.picked{outline:.35cqh solid var(--orange);outline-offset:.3cqh}

     KAI_arrange：种子取内容哈希（同一页每次打开一样，截图可复现），试 200 次洗牌取罚分最低的一种。
     KAI_orderPen(r)：r[k] = 显示第 k 项原来排第几。原位 +10；紧挨的两项保留原来的前后关系
     （正着或倒着）+3；升序步数偏离一半再罚（防「整个倒过来」这类一眼能看出的排法）。ES5 写法。 */
  function KAI_arrange(list,key,pen){
    var n=list.length; if(n<2) return list.slice();
    var rnd=ORD_rnd(ORD_seed(key)),best=list.slice(),bestP=Infinity,t,i,j,x,a,p;
    for(t=0;t<200;t++){ a=list.slice();
      for(i=n-1;i>0;i--){j=Math.floor(rnd()*(i+1));x=a[i];a[i]=a[j];a[j]=x;}
      p=pen(a); if(p<bestP){bestP=p;best=a;} if(p===0)break; }
    return best; }
  function KAI_orderPen(r){ var p=0,up=0,k,n=r.length;
    for(k=0;k<n;k++){ if(r[k]===k) p+=10;
      if(k>0){ if(r[k]===r[k-1]+1||r[k]===r[k-1]-1) p+=3; if(r[k]>r[k-1]) up++; } }
    return p+Math.max(0,Math.abs(up-(n-1)/2)-1); }
  function KAI_taught(){ var out=[],seen={},S=(L&&L.slides)||[];
    S.forEach(function(s){ if(s.type==='spotlight'&&s.w) out.push(s.w);
      if(s.type==='quickset'&&s.words) s.words.forEach(function(x){ out.push(x.w||x); }); });
    if(!out.length) S.forEach(function(s){ if(s.type==='vocabIntro'&&s.words) s.words.forEach(function(x){ out.push(x.w||x); }); });
    return out.filter(function(w){ if(seen[w]) return false; seen[w]=1; return true; }); }
  function KAI_gameRounds(s){ var rs=s.rounds||[]; if(rs.length<3) return s;
    var tau=KAI_taught(), pos=rs.map(function(r){ return tau.indexOf(r.ans); }), up=0, k;
    if(pos.some(function(p){ return p<0; })) return s;
    for(k=1;k<pos.length;k++) if(pos[k]>pos[k-1]) up++;
    if(up/(pos.length-1)<0.75) return s;   // 作者本来就打乱过的不动（有的带课卡写了「第 3 轮」）
    var sorted=pos.slice().sort(function(a,b){ return a-b; }), rk=pos.map(function(p){ return sorted.indexOf(p); });
    var o={},key; for(key in s) o[key]=s[key];
    o.rounds=KAI_arrange(rs.map(function(r,i){ return {r:r,i:i}; }), rs.map(function(r){ return r.ans; }).join('|'),
      function(a){ return KAI_orderPen(a.map(function(x){ return rk[x.i]; })); }).map(function(x){ return x.r; });
    return o; }

  // 排序打分 diamond/rank：按顺序点 chip，赋 1,2,3… 开放题，重在说理

  // 记忆翻牌配对（词 ↔ 义/图）
  R.memory = (s)=>{ const d=el('div','slide '+('bg-'+(s.bg||'rose')));

      ${s.pool?`<div class="wrap" style="margin-top:1.8cqh;justify-content:center">${s.pool.map(w=>`<span class="chip spword" style="--cl:var(--teal-l);--c:var(--teal-d)">${w}</span>`).join('')}</div>`:''}
      <div class="spkcard"><div class="spkmic">🎤</div><div class="spkframe">${rt(s.frame)}</div></div>
      <div class="spkrule">✎ ${rt(s.rule||'Say at least 4 words. Your own words — don’t copy the text!')}</div>`;
    addBlobs(d,s.bg||'lemon');
    d.querySelectorAll('.spword').forEach(c=>c.addEventListener('click',()=>{
      d.querySelectorAll('.spword').forEach(x=>x.classList.remove('picked')); c.classList.add('picked'); }));
    return d; };

  // ---------- 装配 ----------
  L.slides.forEach((s,i)=>{ const fn=R[s.type]||R.content; const node=fn(s); node.dataset.i=i; deck.appendChild(node);
    const dot=el('div','dot'); dot.addEventListener('click',()=>go(i)); dotsEl.appendChild(dot); });
  badgeEl.textContent = L.id + ' · ' + L.title;

  const slides=[...deck.querySelectorAll('.slide')], dots=[...dotsEl.children];
  function go(n){ cur=Math.max(0,Math.min(N-1,n));
    slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
    dots.forEach((d,i)=>d.classList.toggle('on',i===cur));
    // 暂停非当前页视频
    deck.querySelectorAll('video').forEach(v=>{ if(!v.closest('.slide').classList.contains('active')) v.pause(); });
  }
  const startAt=(()=>{ const m=/[?&]s=(\d+)/.exec(location.search); return m?(+m[1]-1):0; })();
  go(startAt);
  document.getElementById('prev').addEventListener('click',()=>go(cur-1));
  document.getElementById('next').addEventListener('click',()=>go(cur+1));
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);
    if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1); });
})();

</script>
</body></html>
