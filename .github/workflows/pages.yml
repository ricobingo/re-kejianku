# Publish https://ricobingo.github.io/re-kejianku/
#
# The generated pages-build-deployment workflow still requests an OIDC token
# for https://github.com/ricober33. actions/deploy-pages calls getIDToken()
# with no audience, so it can keep that stale audience. This workflow asks for
# https://github.com/ricobingo explicitly.
#
# Permissions are only contents, pages, and id-token. "administration" is not
# a GITHUB_TOKEN permission; putting it in this file makes Actions reject the
# workflow before any job starts.
#
# One-time repo setting: Settings → Pages → Source: GitHub Actions. That stops
# the generated workflow from publishing the full 1.4 GB tree over this one.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require OIDC audience https://github.com/ricobingo
        run: |
          audience="https://github.com/${{ github.repository_owner }}"
          if [ "$audience" != "https://github.com/ricobingo" ]; then
            echo "::error::Pages OIDC audience must be https://github.com/ricobingo, got ${audience}"
            exit 1
          fi
          echo "Pages OIDC audience: https://github.com/ricobingo"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build site under the 1GB Pages limit
        run: bash scripts/build-pages-site.sh

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/deploy_pages.py
