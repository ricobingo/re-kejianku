# Publish the courseware site from this repository.
#
# Requests an OIDC audience of https://github.com/<current owner> and deploys
# the lesson tree unchanged. actions/upload-pages-artifact leaves .git and
# .github out of the artifact. Lesson mp4s are all referenced and by themselves
# exceed the 1 GiB warning; they stay in the artifact. The same size published
# successfully on 2026-09-26 and again on 2026-10-10.
#
# Do not add a permissions key that is not in the GITHUB_TOKEN schema.
# `administration` is rejected before any job starts.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN scopes only. `administration` is not one of them; adding it
# makes GitHub reject this file before any job starts.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check published site
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/scripts/pages_deploy.py check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/scripts/pages_deploy.py deploy
